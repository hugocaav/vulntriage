version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    command: python -m pipeline.scanner /app reports/raw-findings.json
    env_file:
      - .env
    volumes:
      - ./:/app

